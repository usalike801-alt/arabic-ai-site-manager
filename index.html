<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدير المواقع AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1117;
      color: #ffffff;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* الشريط الجانبي */
    .sidebar {
      width: 280px;
      background: #171a22;
      border-left: 1px solid #292d38;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .status {
      background: #20242e;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .status-title {
      font-size: 13px;
      color: #9da3b0;
      margin-bottom: 8px;
    }

    .status-value {
      color: #ffb020;
      font-weight: bold;
    }

    .site-label {
      font-size: 13px;
      color: #9da3b0;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      background: #20242e;
      color: white;
      border: 1px solid #343946;
      border-radius: 10px;
      padding: 12px;
      outline: none;
    }

    .start-btn {
      margin-top: auto;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #238636;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .start-btn.stop {
      background: #da3633;
    }

    /* المحادثة */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .header {
      height: 65px;
      border-bottom: 1px solid #292d38;
      display: flex;
      align-items: center;
      padding: 0 20px;
      font-weight: bold;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
    }

    .message {
      max-width: 800px;
      margin-bottom: 20px;
      padding: 15px 18px;
      border-radius: 15px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .ai {
      background: #1c2029;
      margin-left: auto;
      margin-right: 0;
    }

    .user {
      background: #24415f;
      margin-right: auto;
      margin-left: 0;
    }

    .input-area {
      padding: 15px;
      border-top: 1px solid #292d38;
      display: flex;
      gap: 8px;
      background: #12151c;
    }

    .input-area textarea {
      flex: 1;
      resize: none;
      height: 55px;
      background: #20242e;
      color: white;
      border: 1px solid #343946;
      border-radius: 12px;
      padding: 15px;
      outline: none;
      font-size: 15px;
    }

    .send-btn,
    .mic-btn {
      width: 55px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: white;
      font-size: 20px;
    }

    .send-btn {
      background: #238636;
    }

    .mic-btn {
      background: #303640;
    }

    @media (max-width: 700px) {
      .sidebar {
        display: none;
      }

      .chat {
        padding: 15px;
      }

      .message {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="logo">
      🤖 مدير المواقع AI
    </div>

    <div class="status">
      <div class="status-title">
        حالة المدير
      </div>

      <div class="status-value" id="status">
        متوقف
      </div>
    </div>

    <div class="site-label">
      الموقع
    </div>

    <select id="site">
      <option>الموقع الأول</option>
    </select>

    <button class="start-btn" id="startBtn" onclick="toggleAI()">
      ▶ تشغيل المدير
    </button>

  </aside>

  <main class="main">

    <header class="header">
      🤖 مدير المواقع AI
    </header>

    <section class="chat" id="chat">

      <div class="message ai">
        👋 أهلاً بك.

        أنا مدير المواقع الخاص بك.

        حاليًا أنا في وضع التجربة، لكن الواجهة جاهزة.

        عندما نربطني بالـ AI والـ SSH سأستطيع تحليل مواقعك وتنفيذ التعديلات التي تطلبها مني.

        اكتب لي أي أمر للتجربة.
      </div>

    </section>

    <div class="input-area">

      <textarea
        id="message"
        placeholder="اكتب أمرك بالعربي..."
      ></textarea>

      <button class="mic-btn" onclick="voiceInput()">
        🎙️
      </button>

      <button class="send-btn" onclick="sendMessage()">
        ➤
      </button>

    </div>

  </main>

</div>

<script>

function addMessage(text, type) {

  const chat = document.getElementById("chat");

  const message = document.createElement("div");

  message.className = "message " + type;

  message.textContent = text;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}


function sendMessage() {

  const input = document.getElementById("message");

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  input.value = "";

  setTimeout(() => {

    addMessage(
      "استلمت أمرك.\n\nأنا حاليًا في وضع الواجهة التجريبية.\nسنربطني في الخطوة التالية بمحرك الذكاء الاصطناعي والـ SSH.",
      "ai"
    );

  }, 600);

}


function toggleAI() {

  const status = document.getElementById("status");

  const button = document.getElementById("startBtn");

  if (status.textContent === "متوقف") {

    status.textContent = "يعمل";

    status.style.color = "#3fb950";

    button.textContent = "■ إيقاف المدير";

    button.classList.add("stop");

    addMessage(
      "🟢 تم تشغيل مدير المواقع.\n\nملاحظة: محرك الذكاء الاصطناعي لم يتم ربطه بعد.",
      "ai"
    );

  } else {

    status.textContent = "متوقف";

    status.style.color = "#ffb020";

    button.textContent = "▶ تشغيل المدير";

    button.classList.remove("stop");

    addMessage(
      "🔴 تم إيقاف مدير المواقع.",
      "ai"
    );

  }

}


function voiceInput() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    alert("المتصفح لا يدعم الإدخال الصوتي.");

    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "ar-EG";

  recognition.interimResults = false;

  recognition.maxAlternatives = 1;

  recognition.start();

  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript;

    document.getElementById("message").value = text;

  };

}

</script>

</body>
</html>
